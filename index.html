<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#131314">
  <meta name="description" content="Search over 136,000 icons and emoji from 48 libraries. Compare styles, filter by library and license, and find source and license details with Icon Wiki.">
  <title>Icon Wiki: Browse Icons</title>
  <link rel="canonical" href="https://iconwiki.aoo.kr/">
  <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/app-icon.svg?v=dark-2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=material-first-1">
</head>
<body>
  <aside class="rail" aria-label="Library menu">
    <a class="brand-mark" href="./" aria-label="Icon Wiki home"><img src="./assets/app-icon.svg?v=dark-2" alt=""></a>
    <button class="rail-button active" id="browse-button" aria-label="Browse library" title="Library"><span class="rail-symbol" aria-hidden="true">category</span><span>Library</span></button>
    <a class="rail-github" href="https://github.com/resoliwan/iconwiki" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="Open Icon Wiki on GitHub"><img src="./assets/lucide/github.svg" alt=""><span class="mobile-only">GitHub</span></a>
    <a class="rail-bottom" href="./README.md" target="_blank" title="Help" aria-label="Help"><span class="help-symbol">?</span><span class="mobile-only">Help</span></a>
  </aside>

  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Icon Wiki home"><img class="mobile-only" src="./assets/app-icon.svg?v=dark-2" alt=""><span class="brand-name">Icon Wiki</span></a>
      <div class="search-box">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
        <input id="search" type="search" placeholder="Search icons" aria-label="Search images" autocomplete="off" spellcheck="false">

      </div>
      <details class="mobile-more mobile-only">
        <summary aria-label="More options"><span class="ui-symbol" aria-hidden="true">more_vert</span></summary>
        <div class="more-menu"><a href="https://github.com/resoliwan/iconwiki" target="_blank" rel="noopener noreferrer">GitHub ↗</a><a href="./README.md" target="_blank">Help ↗</a></div>
      </details>
      <div class="expansion-panel" id="expansion-panel" hidden>
        <strong>AI expansion</strong>
        <div class="expansion-terms" id="expansion-terms"></div>
      </div>
    </header>

    <div class="workspace" id="workspace">
      <main>
        <div class="browse-toolbar">
          <button id="toggle-filters" aria-expanded="false" aria-controls="filters-panel"><span class="ui-symbol" aria-hidden="true">tune</span>Filters</button>
          <div class="active-filters" id="active-filters" aria-label="Active filters"></div>
          <button class="text-button" id="clear-filters" hidden>Clear filters</button>
          <div class="view-switch" role="group" aria-label="Card view">
            <button data-view="images" aria-label="Images only" aria-pressed="true"><span class="ui-symbol" aria-hidden="true">grid_view</span><span class="view-label">Grid</span></button>
            <button data-view="labels" aria-label="Images with labels" aria-pressed="false"><span class="ui-symbol" aria-hidden="true">view_list</span><span class="view-label">Labels</span></button>
          </div>
        </div>

        <div class="result-summary"><span class="result-count" id="result-count" role="status">Loading…</span></div>
        <section class="filters" id="filters-panel" aria-label="Search filters" hidden>
          <div class="filter-actions">
            <button class="text-button" id="reset-filters" type="button"><span class="ui-symbol" aria-hidden="true">restart_alt</span>Reset all</button>
            <button class="close-button" id="close-filters" type="button" aria-label="Hide filters">×</button>
          </div>
          <div class="filter-search-options">
            <h2>Search</h2>
            <input id="within-filter" type="search" placeholder="Filter results" aria-label="Filter current results" autocomplete="off" spellcheck="false">
            <label class="inline-toggle ai-toggle" title="Expand related terms automatically, or press Enter to run again."><input id="smart-search" type="checkbox"> AI expansion</label>
          </div>
          <h2 class="filter-section-title">Filter</h2>
          <details class="filter-group" id="collection-filter" open>
            <summary id="collection-filter-summary"><span class="ui-symbol" aria-hidden="true">category</span>Library</summary>
            <input id="library-search" type="search" placeholder="Find a library" aria-label="Find a library" autocomplete="off">
            <div class="filter-choices" id="collection-options"></div>
          </details>
          <details class="filter-group" id="license-filter" open>
            <summary id="license-filter-summary"><span class="ui-symbol" aria-hidden="true">verified_user</span>License</summary>
            <div class="filter-choices" id="license-options"></div>
          </details>
          <details class="filter-group" open>
            <summary><span class="ui-symbol" aria-hidden="true">manage_search</span>Match range</summary>
            <div class="filter-choices" id="match-options"></div>
          </details>
          <details class="filter-group" open>
            <summary><span class="ui-symbol" aria-hidden="true">tune</span>Options</summary>
            <label class="tone-toggle"><input type="checkbox" id="skin-tones"> Include skin tone variants</label>
          </details>
          <select id="result-filter" aria-label="Select match type" hidden>
            <option value="all">All match ranges</option><option value="exact">Exact</option><option value="keyword">Keyword</option><option value="prefix">Prefix</option><option value="similar">Similar</option>
          </select>
          <select id="display-mode" aria-label="Select card view" hidden><option value="images">Images only</option><option value="labels">Images + labels</option></select>
        </section>

        <div class="emoji-grid" id="grid" aria-label="Image search results" aria-busy="true"></div>
        <button class="button load-more" id="load-more" type="button" aria-controls="grid" hidden>Load more</button>
        <div class="empty-state" id="empty" hidden><span>⌕</span><h2>No matching images</h2><p>Try another word or a shorter search term.</p><button class="button" id="reset">Reset search</button></div>
      </main>
      <aside class="detail" id="detail" aria-label="Image details" hidden></aside>
    </div>
  </div>
  <div class="filter-backdrop" id="filter-backdrop" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript>Enable JavaScript to search and view details.</noscript>
  <script type="module" src="./app.js?v=material-first-2"></script>
</body>
</html>
